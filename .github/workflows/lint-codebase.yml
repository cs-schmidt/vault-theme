name: Lint Codebase

on:
  push:
    # Lint commits pushed to any branch (including newly created branches), while skipping
    # tag-only pushes since tags contain no new commits.
    tags-ignore: ['*']
  pull_request:

permissions:
  contents: read

# Cancel stale or duplicate runs for the same workflow and branch, scoped by:
#   1. Workflow file path (stripped of '@refs/...') to prevent name collisions while
#      matching PRs and pushes to the same group.
#   2. Source repository, so external forks using identical branch names (e.g., 'main')
#      don't cancel each other.
#   3. Normalized branch name across pull_request and push events.
concurrency:
  group: ${{ split(github.workflow_ref, '@')[0] }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7

      - name: 'Setup Node.js'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check linting
        run: npm run lint
